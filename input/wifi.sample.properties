# wifi-tool — WiFi plugin config. Run with:  --plugin wifi --config <this file>
# Copy to input/wifi.properties and edit. Only run against networks you own or may test.

# mode: 1 = scan visible networks, 2 = batch match passwords against a network list
mode=2

# Absolute paths to your lists (one value per line). The plugin resolves a relative path against
# the jar directory (target/), so absolute paths are safest.
networks=/absolute/path/to/input/networks.txt
passwords=/absolute/path/to/input/passwords.txt

# skip: resume the password list at offset N (default 0)
skip=0

# timeout: hard time limit in seconds for one connection check (default 10). The check is stopped
# a second early if it can, and killed at the limit if not; a timed-out check counts as a failure.
timeout=10

# debug: verbose attempt logging (default false)
debug=false
